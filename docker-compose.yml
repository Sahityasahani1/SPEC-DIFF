version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector Extension
  # ----------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: specdiff-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: specdiff
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d specdiff"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - specdiff-network

  # ----------------------------------------------------------------------------
  # Distributed In-Memory Cache (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: specdiff-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - specdiff-network

  # ----------------------------------------------------------------------------
  # FastAPI Production Backend Service (Gunicorn + Uvicorn Workers)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: specdiff-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/specdiff
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_API_KEY=${ADMIN_API_KEY:-specdiff_admin_secret_key_2026}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RATE_LIMIT_RECOMMEND=${RATE_LIMIT_RECOMMEND:-15/minute}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - specdiff-network

  # ----------------------------------------------------------------------------
  # React Production Frontend (Nginx Alpine SPA Server)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: specdiff-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - specdiff-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes & Custom Network Bridge
# ------------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  specdiff-network:
    driver: bridge
